# Pre-commit / pre-push hooks for Jaskiniowy Kataster Tatr Zachodnich.
#
# Install once after cloning:
#     python scripts/initial-setup.py
#
# Hooks use `uv run` so the ruff / pytest versions match pyproject.toml's
# dev dependency group (no version drift between the hook and CI).

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python]
        files: ^(src|scripts|tests)/
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types_or: [python]
        files: ^(src|scripts|tests)/
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: jktz-validate
        name: jktz-validate (full validation, requires cavern + GDAL)
        entry: uv run jktz-validate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
