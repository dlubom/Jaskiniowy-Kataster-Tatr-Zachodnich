[project]
name = "jaskiniowy-kataster-tatr-zachodnich"
version = "0.1.0"
description = "Local validation and export tools for the JKTZ cave registry data."
readme = "INFO.txt"
requires-python = ">=3.9"
dependencies = [
    "gpxpy>=1.6.2",
    "openpyxl>=3.1.5",
    "pyproj>=3.6.1",
    "pyshp>=2.3.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
jktz-locations = "jktz_locations.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "ruff>=0.15.0",
    "ty>=0.0.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jktz_locations"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
