[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jktz-release-tools"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "pyproj>=3.6",
  "pyogrio>=0.8",
]

[project.scripts]
jktz-validate = "jktz.cli.validate:main"
jktz-exports = "jktz.cli.exports:main"
jktz-build-zip = "jktz.cli.build_zip:main"
jktz-render-otwory = "jktz.cli.render_otwory:main"
jktz-srv-metadata = "jktz.cli.srv_metadata:main"
jktz-survex-stats = "jktz.cli.survex_stats:main"
jktz-quality = "jktz.cli.quality:main"
jktz-mutation = "jktz.cli.mutation:main"
jktz-release-metadata = "jktz.cli.release_metadata:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.12,<1.0",
  "pre-commit>=4.0,<5.0",
  "coverage>=7.6,<8",
  "radon>=6,<7",
  "tomli>=2,<3 ; python_full_version < '3.11'",
  "mutmut==3.8.0 ; python_full_version >= '3.10' and sys_platform != 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jktz"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/jktz", "scripts", ".agents/skills", "web"]
data_file = "logs/quality/.coverage"

[tool.coverage.report]
show_missing = true
precision = 2

[tool.jktz.quality]
line_min = 90
branch_min = 85
crap_max = 30
mutation_min = 80

[tool.mutmut]
source_paths = ["src/"]
also_copy = ["Poligony/OTWORY.SRV.j2"]
only_mutate = [
  "src/jktz/metadata/io.py",
  "src/jktz/metadata/raw.py",
  "src/jktz/metadata/srv.py",
  "src/jktz/entrances/render.py",
  "src/jktz/validation/measurements.py",
]
pytest_add_cli_args = ["-q", "-x"]
pytest_add_cli_args_test_selection = [
  "tests/test_metadata_io.py",
  "tests/test_raw_metadata.py",
  "tests/test_srv_metadata.py",
  "tests/test_srv_metadata_cli.py",
  "tests/test_render_otwory.py",
  "tests/test_validation_measurements.py",
]
mutate_only_covered_lines = false
use_setproctitle = false
