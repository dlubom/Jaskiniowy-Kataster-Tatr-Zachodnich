name: Install resvg (Linux)
description: Install the P01-verified resvg CLI 0.48.1 with pinned archive and binary checksums.

runs:
  using: composite
  steps:
    - name: Install pinned resvg
      shell: bash
      run: |
        set -euo pipefail
        renderer_dir="$RUNNER_TEMP/jktz-resvg-0.48.1"
        mkdir -p "$renderer_dir"
        curl --fail --location --retry 3 \
          https://github.com/linebender/resvg/releases/download/v0.48.1/resvg-linux-x86_64.tar.gz \
          --output "$renderer_dir/resvg.tar.gz"
        echo "fa8c26495a187e592c501db15bf9e8a9fdc051d4b2b336b39703d5b59f912b9d  $renderer_dir/resvg.tar.gz" | sha256sum --check
        tar -xzf "$renderer_dir/resvg.tar.gz" -C "$renderer_dir"
        echo "8d1dbe4d8e56d3d052668afc69d9d93fba7b723b06f1d3425f29418da9a816af  $renderer_dir/resvg" | sha256sum --check
        "$renderer_dir/resvg" --version
        echo "RESVG=$renderer_dir/resvg" >> "$GITHUB_ENV"
        echo "JKTZ_REQUIRE_RESVG=1" >> "$GITHUB_ENV"
