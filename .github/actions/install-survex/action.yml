name: Install Survex (Linux)
description: >
  Build and install Survex on Ubuntu runners, caching the install prefix at
  ~/survex. The source tarball and build tree live in $RUNNER_TEMP so they
  never land inside the repo checkout (otherwise jktz-build-zip would pack
  them into the release ZIP).

inputs:
  version:
    description: Survex version to install
    required: true

runs:
  using: composite
  steps:
    - name: Read Ubuntu version
      id: ubuntu
      shell: bash
      run: |
        source /etc/os-release
        echo "version=$VERSION_ID" >> "$GITHUB_OUTPUT"

    - name: Cache Survex
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/survex
        key: survex-${{ inputs.version }}-ubuntu-${{ steps.ubuntu.outputs.version }}-${{ runner.arch }}

    - name: Install Survex
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwxgtk3.2-dev libproj-dev libgdal-dev gdal-bin
        if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
          echo "Using cached Survex"
        else
          sudo apt-get install -y build-essential
          cd "$RUNNER_TEMP"
          wget "https://survex.com/software/${{ inputs.version }}/survex-${{ inputs.version }}.tar.gz"
          tar xf "survex-${{ inputs.version }}.tar.gz"
          cd "survex-${{ inputs.version }}"
          ./configure --prefix="$HOME/survex"
          make
          make install
        fi
        echo "$HOME/survex/bin" >> "$GITHUB_PATH"

    - name: Verify Survex version
      shell: bash
      env:
        EXPECTED_SURVEX_VERSION: ${{ inputs.version }}
      run: |
        for tool in cavern survexport dump3d; do
          banner="$("$HOME/survex/bin/$tool" --version)"
          echo "$banner"
          if [[ "$banner" != *" - Survex $EXPECTED_SURVEX_VERSION" ]]; then
            echo "Unexpected $tool version (expected $EXPECTED_SURVEX_VERSION)" >&2
            exit 1
          fi
        done
