name: Validate (cavern)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  SURVEX_VERSION: "1.4.22"

jobs:
  python-tools:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python tooling
        run: uv sync --locked

      - name: Run Ruff and Pytest
        run: |
          uv run ruff format --check src scripts tests
          uv run ruff check src scripts tests
          uv run pytest

      - name: Check rendered entrance snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/render_otwory_from_gps.py --check

  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python tooling
        run: uv sync --locked

      - name: Run Pytest (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest

      - name: Install Survex
        uses: ./.github/actions/install-survex
        with:
          version: ${{ env.SURVEX_VERSION }}

      - name: Run full validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run jktz-validate

  pr-release-package:
    if: github.event_name == 'pull_request'
    needs: [python-tools, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute package version
        id: package
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          version="pr-${{ github.event.pull_request.number }}-${short_sha}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "zip=JKTZ-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python tooling
        run: uv sync --locked

      - name: Set version in INFO.txt
        run: sed -i 's/__VERSION__/${{ steps.package.outputs.version }}/' INFO.txt

      - name: Render latest entrance fixes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/render_otwory_from_gps.py

      - name: Install Survex
        uses: ./.github/actions/install-survex
        with:
          version: ${{ env.SURVEX_VERSION }}

      - name: Build exports
        run: uv run jktz-exports ${{ steps.package.outputs.version }}

      - name: Build PR release ZIP
        run: uv run jktz-build-zip ${{ steps.package.outputs.version }}

      - name: Upload PR release ZIP
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 14

      - name: Add package link to job summary
        run: |
          {
            echo "### PR test release package"
            echo ""
            echo "- Version: \`${{ steps.package.outputs.version }}\`"
            echo "- Artifact: [${{ steps.package.outputs.zip }}](${{ steps.upload.outputs.artifact-url }})"
            echo "- Retention: 14 days"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Link package in pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- jktz-pr-release-package -->';
            const body = [
              marker,
              '### PR test release package',
              '',
              '- Version: `${{ steps.package.outputs.version }}`',
              '- Artifact: [${{ steps.package.outputs.zip }}](${{ steps.upload.outputs.artifact-url }})',
              '- Retention: 14 days',
              '',
              'This is a temporary GitHub Actions artifact for PR testing. It is not a public GitHub Release.',
            ].join('\n');

            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
