name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SURVEX_VERSION: "1.4.20"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set version in INFO.txt
        run: sed -i 's/__VERSION__/${{ steps.version.outputs.VERSION }}/' INFO.txt

      - name: Cache Survex
        id: cache-survex
        uses: actions/cache@v4
        with:
          path: ~/survex
          key: survex-${{ env.SURVEX_VERSION }}-ubuntu

      - name: Install Survex
        run: |
          if [ "${{ steps.cache-survex.outputs.cache-hit }}" = "true" ]; then
            echo "Using cached Survex"
            sudo apt-get update && sudo apt-get install -y libproj25 libgdal34t64 gdal-bin
          else
            sudo apt-get update && sudo apt-get install -y build-essential libwxgtk3.2-dev libproj-dev libgdal-dev gdal-bin
            cd "$RUNNER_TEMP"
            wget https://survex.com/software/${{ env.SURVEX_VERSION }}/survex-${{ env.SURVEX_VERSION }}.tar.gz
            tar xf survex-${{ env.SURVEX_VERSION }}.tar.gz
            cd survex-${{ env.SURVEX_VERSION }}
            ./configure --prefix=$HOME/survex
            make
            make install
          fi
          echo "$HOME/survex/bin" >> $GITHUB_PATH

      - name: Build exports
        run: bash docker/exports.sh ${{ steps.version.outputs.VERSION }} .

      - name: Build release ZIP
        run: |
          zip -r "JKTZ-${{ steps.version.outputs.VERSION }}.zip" . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".claude/*" \
            -x "docker/*" \
            -x ".gitignore" \
            -x "CLAUDE.md" \
            -x "doc/*" \
            -x "logs/*" \
            -x "*/_RAW/*" \
            -x "*.DS_Store" \
            -x "*.nta" \
            -x "*.ntn" \
            -x "*.ntv" \
            -x "*.nts" \
            -x "*.ntp" \
            -x "*.wrl" \
            -x "*.log" \
            -x "*.lst" \
            -x "web/*"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          # Extract content between the first ## [vX.Y.Z] header and the next ## header
          NOTES=$(awk '/^## \['"${{ steps.version.outputs.VERSION }}"'\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md)
          # Write to file for the release action
          echo "$NOTES" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            JKTZ-${{ steps.version.outputs.VERSION }}.zip
