name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  gps-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Download one GPS release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked jktz-gps-snapshot logs/gps-snapshot
      - name: Share GPS snapshot
        uses: actions/upload-artifact@v4
        with:
          name: gps-snapshot
          path: logs/gps-snapshot/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release:
    needs: [gps-snapshot]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Survex version
        id: survex
        uses: ./.github/actions/read-survex-version

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python tooling
        run: uv sync --locked

      - name: Install PocketTopo Exporter binary
        uses: ./.github/actions/install-pockettopo-exporter

      - name: Validate Python tooling
        run: uv run jktz-quality

      - name: Run mutation gate
        run: uv run jktz-mutation

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality
          path: logs/quality/
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare release metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: uv run jktz-release-metadata "$RELEASE_VERSION" --notes release_notes.md

      - name: Download GPS snapshot
        uses: actions/download-artifact@v4
        with:
          name: gps-snapshot
          path: logs/gps-snapshot


      - name: Install Survex
        uses: ./.github/actions/install-survex
        with:
          version: ${{ steps.survex.outputs.version }}

      - name: Validate GPS and build checked exports
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: uv run jktz-validate --gps-snapshot logs/gps-snapshot --export-version "$RELEASE_VERSION"

      - name: Build release ZIP
        run: uv run jktz-build-zip ${{ steps.version.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            JKTZ-${{ steps.version.outputs.VERSION }}.zip
