name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SURVEX_VERSION: "1.4.21"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python tooling
        run: uv sync --locked

      - name: Validate Python tooling
        run: |
          uv run ruff format --check src scripts tests
          uv run ruff check src scripts tests
          uv run pytest

      - name: Set version in INFO.txt
        run: sed -i 's/__VERSION__/${{ steps.version.outputs.VERSION }}/' INFO.txt

      - name: Check rendered entrance snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/render_otwory_from_gps.py --check

      - name: Cache Survex
        id: cache-survex
        uses: actions/cache@v4
        with:
          path: ~/survex
          key: survex-${{ env.SURVEX_VERSION }}-ubuntu

      - name: Install Survex
        run: |
          if [ "${{ steps.cache-survex.outputs.cache-hit }}" = "true" ]; then
            echo "Using cached Survex"
            sudo apt-get update && sudo apt-get install -y libproj25 libgdal34t64 gdal-bin libwxgtk3.2-1t64
          else
            sudo apt-get update && sudo apt-get install -y build-essential libwxgtk3.2-dev libproj-dev libgdal-dev gdal-bin
            wget https://survex.com/software/${{ env.SURVEX_VERSION }}/survex-${{ env.SURVEX_VERSION }}.tar.gz
            tar xf survex-${{ env.SURVEX_VERSION }}.tar.gz
            cd survex-${{ env.SURVEX_VERSION }}
            ./configure --prefix=$HOME/survex
            make
            make install
          fi
          echo "$HOME/survex/bin" >> $GITHUB_PATH

      - name: Build exports
        run: uv run jktz-exports ${{ steps.version.outputs.VERSION }}

      - name: Build release ZIP
        run: uv run jktz-build-zip ${{ steps.version.outputs.VERSION }}

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          # Extract content between the first ## [vX.Y.Z] header and the next ## header
          NOTES=$(awk '/^## \['"${{ steps.version.outputs.VERSION }}"'\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md)
          # Write to file for the release action
          echo "$NOTES" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            JKTZ-${{ steps.version.outputs.VERSION }}.zip
